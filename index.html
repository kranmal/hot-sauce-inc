<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hot Sauce Inc</title>
<script>
(function(){var t=null;try{t=localStorage.getItem("hs_theme")}catch(e){}
if(!t)t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
document.documentElement.setAttribute("data-theme",t)})();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8f1; --surface:#fff; --ink:#2a1410; --muted:#85695f; --line:#f0ddd0;
  --fire:#e8380d; --fire-2:#ff7a18; --ember:#ffb347; --deep:#3b0d06; --ok:#1f9d55;
  --shadow:0 1px 2px rgba(60,20,5,.06),0 8px 24px rgba(60,20,5,.08);
  --r:18px;
}
:root{--bg:#fdf1e6;--glow1:rgba(255,140,60,.22);--glow2:rgba(255,200,120,.35);color-scheme:light}
:root[data-theme=dark]{--bg:#110a0e;--surface:#1c1117;--ink:#fbeee6;--muted:#b9a39b;--line:#33222a;--glow1:rgba(232,56,13,.20);--glow2:rgba(255,122,24,.10);--shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.4);color-scheme:dark}
body{background:radial-gradient(900px 500px at 90% -10%,var(--glow1),transparent 60%),radial-gradient(800px 500px at -10% 40%,var(--glow2),transparent 60%),var(--bg);background-attachment:fixed}
.theme-fab{position:fixed;top:1rem;right:1rem;z-index:30}
.icon-btn{cursor:pointer;transition:transform .15s,border-color .15s}.icon-btn:hover{transform:translateY(-1px);border-color:var(--fire)}
.sun{display:none}:root[data-theme=dark] .sun{display:block}:root[data-theme=dark] .moon{display:none}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
h1,h2,h3,.brand{font-family:Fraunces,Georgia,serif;letter-spacing:-.02em}
button{font:inherit;cursor:pointer}
a{color:inherit}
.btn{border:0;border-radius:999px;padding:.7rem 1.3rem;font-weight:600;background:linear-gradient(135deg,var(--fire),var(--fire-2));color:#fff;box-shadow:0 6px 16px rgba(232,56,13,.3);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(232,56,13,.38)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--fire);color:var(--fire)}
.btn.danger{background:transparent;color:var(--fire);box-shadow:inset 0 0 0 1.5px var(--fire)}
.btn.sm{padding:.5rem 1rem;font-size:.85rem}
/* header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:auto;padding:.8rem 1.25rem;display:flex;align-items:center;gap:1rem}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;margin-right:auto}
.brand i{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#14070a;box-shadow:0 0 0 1.5px #ff7a18,0 4px 14px rgba(232,56,13,.4)}
.wm{display:flex;flex-direction:column;line-height:1}
.wm b{font-family:Fraunces,serif;font-style:italic;font-weight:800;font-size:1.55rem;letter-spacing:-.01em;background:linear-gradient(180deg,#ffd24a,#ff6a14 60%,#e8380d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.wm em{font-style:normal;font-weight:800;font-size:.6rem;letter-spacing:.32em;color:var(--ink);margin-top:2px}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2.2rem;padding:1.1rem 1.3rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.trust>div{display:flex;gap:.8rem;align-items:center;color:var(--fire)}
.trust span{display:flex;flex-direction:column;color:var(--ink)}.trust small{color:var(--muted);font-size:.78rem}.trust b{font-size:.9rem}
.foot{max-width:1120px;margin:auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:2rem;text-align:left;padding-bottom:1.5rem}
.foot p{margin-top:.8rem;max-width:280px;line-height:1.6}
.foot h4{color:var(--ink);font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.7rem}
.foot a:not(.brand){display:block;text-decoration:none;margin-bottom:.45rem}.foot a:not(.brand):hover{color:var(--fire)}
.legal{border-top:1px solid var(--line);padding-top:1.2rem}
footer{padding-bottom:1.5rem!important}
@media(max-width:800px){.trust{grid-template-columns:1fr 1fr}.foot{grid-template-columns:1fr 1fr}}
.icon-btn{position:relative;background:var(--surface);border:1px solid var(--line);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;color:var(--ink)}
.badge{position:absolute;top:-4px;right:-4px;background:var(--fire);color:#fff;font-size:.7rem;font-weight:700;min-width:19px;height:19px;border-radius:99px;display:grid;place-items:center;padding:0 5px}
.menu{position:absolute;right:1.25rem;top:60px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:.4rem;min-width:190px;display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:.65rem .8rem;border-radius:9px;color:var(--ink)}
.menu button:hover{background:var(--bg);color:var(--fire)}
main{flex:1;width:100%;max-width:1120px;margin:auto;padding:1.5rem 1.25rem 3rem}
footer{border-top:1px solid var(--line);padding:1.5rem;text-align:center;color:var(--muted);font-size:.85rem}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:radial-gradient(circle at 30% 20%,#ff7a18,transparent 55%),linear-gradient(160deg,#e8380d,#3b0d06);display:grid;place-items:center;padding:2rem;color:#fff;position:relative;overflow:hidden}
.login-art .bottles{display:flex;gap:0;align-items:flex-end;transform:rotate(-4deg)}
.login-art .bottles svg{filter:drop-shadow(0 20px 24px rgba(0,0,0,.4))}
.login-art h2{position:absolute;bottom:2rem;left:2rem;right:2rem;font-size:2rem;font-weight:800;line-height:1.1}
.login-form{display:grid;place-items:center;padding:2rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.login-card{width:100%;max-width:400px;padding:2rem}
.login-card h1{font-size:2rem;margin-bottom:.25rem}
.login-card p.sub{color:var(--muted);margin-bottom:1.5rem}
.field{margin-bottom:1rem}
.field label{display:block;font-size:.8rem;font-weight:600;margin-bottom:.35rem;color:var(--muted)}
input,select{width:100%;font:inherit;padding:.75rem .9rem;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
input:focus,select:focus{border-color:var(--fire);box-shadow:0 0 0 4px rgba(232,56,13,.12)}
.error{background:rgba(232,56,13,.1);color:var(--fire);border:1px solid rgba(232,56,13,.3);padding:.7rem .9rem;border-radius:12px;margin-bottom:1rem;font-size:.9rem;font-weight:500}
.creds{margin-top:1.5rem;padding-top:1rem;border-top:1px dashed var(--line);font-size:.8rem;color:var(--muted);line-height:1.7}
.creds code{background:var(--bg);padding:.1rem .45rem;border-radius:6px;color:var(--fire);cursor:pointer}
/* hero + grid */
.hero{border-radius:28px;padding:2.4rem 2.4rem;color:#fff;background:radial-gradient(circle at 85% 30%,rgba(255,179,71,.65),transparent 45%),linear-gradient(120deg,#c92a08,#3b0d06);display:flex;justify-content:space-between;align-items:center;overflow:hidden;margin-bottom:2rem;position:relative}
.hero h1{font-size:clamp(2rem,4.5vw,3.2rem);line-height:1.05;max-width:520px;font-weight:800}
.hero p{opacity:.85;margin-top:.8rem;max-width:440px}
.hero .art{display:flex;margin-right:1rem}
.hero .art svg{margin-left:-14px;filter:drop-shadow(0 14px 14px rgba(0,0,0,.35))}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem;gap:1rem}
.toolbar h2{font-size:1.6rem}
.toolbar select{width:auto;min-width:210px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.3rem}
.item{display:flex;flex-direction:column;overflow:hidden;transition:transform .2s,box-shadow .2s}
.item:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(60,20,5,.16)}
.thumb{display:block;background:var(--tint);padding:1.2rem 0 .6rem;text-align:center;position:relative}
.thumb>svg{height:210px;width:auto;transition:transform .3s}
.item:hover .thumb>svg{transform:scale(1.06) rotate(-3deg)}
.heat{position:absolute;top:.8rem;left:.8rem;background:rgba(255,255,255,.9);color:#3b0d06;font-size:.72rem;font-weight:700;padding:.25rem .6rem;border-radius:99px}
.item-body{padding:1.1rem 1.2rem 1.3rem;display:flex;flex-direction:column;flex:1}
.item-body h3{font-size:1.2rem;text-decoration:none}
.item-body h3 a{text-decoration:none}
.item-body h3 a:hover{color:var(--fire)}
.item-body p{color:var(--muted);font-size:.88rem;margin:.4rem 0 1rem;line-height:1.5;flex:1}
.row{display:flex;justify-content:space-between;align-items:center}
.price{font-family:Fraunces,serif;font-weight:800;font-size:1.4rem}
/* product detail */
.back{display:inline-flex;margin-bottom:1rem;color:var(--muted);text-decoration:none;font-weight:600}
.back:hover{color:var(--fire)}
.detail{display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.detail .thumb{display:grid;place-items:center;padding:2rem}
.detail .thumb>svg{height:420px}
.detail .info{padding:2.4rem;display:flex;flex-direction:column;gap:1rem;justify-content:center}
.detail h1{font-size:2.3rem}
.meter{display:flex;gap:4px}.meter span{width:26px;height:8px;border-radius:4px;background:var(--line)}.meter span.on{background:linear-gradient(90deg,var(--ember),var(--fire))}
/* cart/checkout */
.page-title{font-size:2rem;margin-bottom:1.2rem}
.lines{display:flex;flex-direction:column;gap:.8rem;margin-bottom:1.5rem}
.line{display:grid;grid-template-columns:76px 1fr auto auto;gap:1rem;align-items:center;padding:.8rem 1rem}
.line .mini{background:var(--tint);border-radius:12px;height:76px;display:grid;place-items:center}
.line .mini svg{height:66px}
.line h3{font-size:1.05rem}.line small{color:var(--muted)}
.empty{text-align:center;padding:3rem;color:var(--muted)}
.actions{display:flex;gap:.8rem;justify-content:space-between;flex-wrap:wrap}
.form{max-width:520px;padding:1.8rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.summary{max-width:560px;padding:1.5rem;margin-top:1rem}
.summary .row{padding:.35rem 0;color:var(--muted)}
.summary .total{color:var(--ink);font-weight:700;font-size:1.2rem;border-top:1px solid var(--line);margin-top:.5rem;padding-top:.8rem}
.done{text-align:center;max-width:520px;margin:3rem auto;padding:3rem 2rem}
.done .check{width:84px;height:84px;border-radius:50%;margin:0 auto 1.2rem;background:linear-gradient(135deg,#1f9d55,#5ad28a);color:#fff;display:grid;place-items:center;font-size:2.4rem}
.done p{color:var(--muted);margin:.7rem 0 1.5rem}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translate(-50%,120px);background:var(--deep);color:#fff;padding:.75rem 1.2rem;border-radius:99px;transition:transform .3s;z-index:50;font-size:.9rem}
.toast.show{transform:translate(-50%,0)}
@media(max-width:800px){
  .login{grid-template-columns:1fr}.login-art{min-height:240px}.login-art h2{font-size:1.4rem}
  .hero .art{display:none}.detail{grid-template-columns:1fr}.detail .thumb>svg{height:300px}
  .line{grid-template-columns:60px 1fr auto}.line .btn{grid-column:2/4}
  .toolbar{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
/* ---------- data ---------- */
const PRODUCTS=[
 {id:1,name:"Ghost Pepper Inferno",price:14.99,heat:5,c:"#c4160a",c2:"#ff4a1c",tint:"#ffe3dc",label:"GHOST",desc:"Bhut jolokia, smoked garlic and a slow-building burn that lingers. Not for the faint of heart."},
 {id:2,name:"Carolina Reaper Reserve",price:19.99,heat:5,c:"#7a0c1c",c2:"#d4213d",tint:"#fbdde2",label:"REAPER",desc:"The world's hottest pepper aged in oak barrels. Fruity first, then pure fire."},
 {id:3,name:"Habanero Mango Fusion",price:9.99,heat:3,c:"#e8860c",c2:"#ffc233",tint:"#fff0d0",label:"MANGO",desc:"Sun-ripened mango meets fresh habanero. Sweet, tropical and dangerously drinkable."},
 {id:4,name:"Chipotle Smoke Show",price:12.99,heat:2,c:"#5c2f14",c2:"#a5612f",tint:"#f3e2d3",label:"SMOKE",desc:"Hickory-smoked chipotle with a hint of molasses. Perfect on eggs, tacos and BBQ."},
 {id:5,name:"Jalapeño Verde Cool",price:7.99,heat:1,c:"#1f7a3a",c2:"#6cc24a",tint:"#e1f5d8",label:"VERDE",desc:"Bright green jalapeño, lime and cilantro. A fresh kick that goes on everything."},
 {id:6,name:"Garlic Rush Sriracha",price:8.49,heat:2,c:"#b3140f",c2:"#f0452b",tint:"#ffe5df",label:"GARLIC",desc:"Fermented red chilies and a mountain of garlic. Our take on the classic rooster sauce."}
];
const USERS={standard_user:"hot_sauce",locked_out_user:"hot_sauce"};
const $=s=>document.querySelector(s);
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let cart=store.get("hs_cart",[]), user=store.get("hs_user",null), sortBy="az", info=store.get("hs_info",null);
const money=n=>"$"+n.toFixed(2);
const prod=id=>PRODUCTS.find(p=>p.id==id);
const saveCart=()=>store.set("hs_cart",cart);

/* ---------- bottle illustration (SVG) ---------- */
function bottle(p,h=220){
 const g="g"+p.id+Math.random().toString(36).slice(2,6);
 return `<svg viewBox="0 0 120 240" height="${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${p.name} bottle">
 <defs>
  <linearGradient id="${g}" x1="0" x2="1"><stop offset="0" stop-color="${p.c}"/><stop offset=".45" stop-color="${p.c2}"/><stop offset="1" stop-color="${p.c}"/></linearGradient>
  <linearGradient id="${g}s" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".2" stop-color="#fff" stop-opacity=".45"/><stop offset=".32" stop-color="#fff" stop-opacity="0"/></linearGradient>
 </defs>
 <ellipse cx="60" cy="230" rx="42" ry="7" fill="#000" opacity=".18"/>
 <rect x="44" y="6" width="32" height="30" rx="6" fill="#1b1b1b"/>
 <rect x="44" y="6" width="32" height="8" rx="4" fill="#3a3a3a"/>
 <path d="M48 36h24v22c0 8 24 18 24 40v112c0 8-6 14-14 14H38c-8 0-14-6-14-14V98c0-22 24-32 24-40z" fill="url(#${g})"/>
 <path d="M48 36h24v22c0 8 24 18 24 40v112c0 8-6 14-14 14H38c-8 0-14-6-14-14V98c0-22 24-32 24-40z" fill="url(#${g}s)"/>
 <defs>
  <linearGradient id="${g}h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3a8"/><stop offset=".45" stop-color="#ffb21e"/><stop offset="1" stop-color="#ff3d0a"/></linearGradient>
  <linearGradient id="${g}r" x1="0" x2="1"><stop offset="0" stop-color="#ff3d0a"/><stop offset="1" stop-color="#ff9a1f"/></linearGradient>
  <radialGradient id="${g}f" cx=".5" cy=".75" r=".7"><stop offset="0" stop-color="#ffd24a"/><stop offset=".5" stop-color="#ff7a18"/><stop offset="1" stop-color="#d9200a"/></radialGradient>
 </defs>
 <rect x="25" y="106" width="70" height="96" rx="8" fill="#14070a"/>
 <rect x="26.5" y="107.5" width="67" height="93" rx="7" fill="none" stroke="url(#${g}r)" stroke-width="1"/>
 <path d="M60 110c7 8 12 14 12 21a12 12 0 0 1-24 0c0-5 3-8 5-12 2 3 4 4 5 4 1-5-1-9 2-13z" fill="url(#${g}f)"/>
 <path d="M60 120c3 4 5 7 5 10a5 5 0 0 1-10 0c0-3 2-5 5-10z" fill="#fff1a0"/>
 <text x="61.2" y="152.2" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-size="25" font-weight="800" font-style="italic" fill="#000" opacity=".55">HOT</text>
 <text x="60" y="151" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-size="25" font-weight="800" font-style="italic" fill="url(#${g}h)" stroke="#fff6dc" stroke-width=".7" paint-order="stroke">HOT</text>
 <path d="M23 156h74l-5 6 5 6H23l5-6z" fill="url(#${g}r)"/>
 <text x="60" y="165.5" text-anchor="middle" font-family="Inter,sans-serif" font-size="8.6" font-weight="800" fill="#fff" letter-spacing="1.6">SAUCE INC</text>
 <text x="60" y="183" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-size="10.5" font-weight="800" fill="#fdeee3" letter-spacing="1">${p.label}</text>
 <rect x="40" y="187" width="40" height=".8" fill="${p.c2}"/>
 <text x="60" y="195" text-anchor="middle" font-family="Inter,sans-serif" font-size="4.4" fill="#c4a597" letter-spacing=".4">SMALL BATCH · 5 FL OZ</text>
 </svg>`;
}
const pepperSvg=`<svg width="11" height="13" viewBox="0 0 24 28" fill="#e8380d"><path d="M16 2c1 0 2 1 2 2-1 1-2 1-3 1 3 1 6 4 6 9 0 7-6 12-15 11 8-2 9-8 8-13 0-2 0-4 2-6z"/></svg>`;
const peppers=n=>`<span style="display:inline-flex;gap:2px;vertical-align:middle">${pepperSvg.repeat(n)}</span>&nbsp;Heat ${n}/5`;
const flameSvg=(s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"><defs><linearGradient id="lf" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff3d0a"/><stop offset="1" stop-color="#ffd24a"/></linearGradient></defs><path fill="url(#lf)" d="M12 1c2 4 7 7 7 13a7 7 0 0 1-14 0c0-3 1-5 3-7 0 2 1 3 2 3 1-3 0-6 2-9z"/><path fill="#fff4b0" d="M12 12c2 2 3 3 3 5a3 3 0 0 1-6 0c0-2 1-3 3-5z"/></svg>`;
const logo=()=>`<a class="brand" href="#/inventory"><i>${flameSvg(22)}</i><span class="wm"><b>HOT</b><em>SAUCE INC</em></span></a>`;
const ico={cart:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.5 11h10L20 7H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>`,
 theme:`<svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg><svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`,
 menu:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>`,
 truck:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h11v10H2zM13 10h5l3 3v3h-8"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></svg>`,
 leaf:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-9 5-14 15-14 0 10-5 15-14 15M5 19l8-8"/></svg>`,
 jar:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6v3H9zM7 6h10l1 4v10a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V10z"/></svg>`,
 shield:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>`};
const meter=n=>`<div class="meter" aria-label="Heat ${n} of 5">${[1,2,3,4,5].map(i=>`<span class="${i<=n?"on":""}"></span>`).join("")}</div>`;

/* ---------- layout ---------- */
function shell(inner){
 return `<header><div class="bar">
  ${logo()}
  <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle light/dark theme" title="Toggle theme" data-test="theme">${ico.theme}</button>
  <button class="icon-btn" id="menuBtn" aria-label="Menu" data-test="menu">${ico.menu}</button>
  <a class="icon-btn" href="#/cart" aria-label="Cart" data-test="cart">${ico.cart}${cart.length?`<span class="badge" data-test="cart-badge">${cart.length}</span>`:""}</a>
  <div class="menu" id="menu">
   <button onclick="location.hash='#/inventory'">All Sauces</button>
   <button id="resetBtn">Reset App State</button>
   <button id="logoutBtn">Logout</button>
  </div></div></header>
 <main>${inner}</main>
 <footer><div class="foot">
  <div>${logo()}<p>Small-batch hot sauces, crafted with real peppers and nothing to hide.</p></div>
  <div><h4>Shop</h4><a href="#/inventory">All sauces</a><a href="#/cart">Cart</a></div>
  <div><h4>Company</h4><a href="#/inventory">Our story</a><a href="#/inventory">Contact</a></div>
  <div><h4>Support</h4><a href="#/inventory">Shipping</a><a href="#/inventory">Returns</a></div></div>
  <div class="legal">© 2026 Hot Sauce Inc. A demo store; nothing is shipped.</div></footer>`;
}
function bind(){
 const mb=$("#menuBtn"); if(!mb) return;
 mb.onclick=e=>{e.stopPropagation();$("#menu").classList.toggle("open")};
 document.onclick=()=>$("#menu")&&$("#menu").classList.remove("open");
 $("#logoutBtn").onclick=()=>{user=null;store.set("hs_user",null);location.hash="#/login"};
 $("#resetBtn").onclick=()=>{cart=[];saveCart();render();toast("App state reset")};
}
window.toggleTheme=()=>{const d=document.documentElement,n=d.dataset.theme==="dark"?"light":"dark";d.dataset.theme=n;try{localStorage.setItem("hs_theme",n)}catch{}};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1800)}

/* ---------- views ---------- */
const views={
 login(){
  const bs=[PRODUCTS[4],PRODUCTS[2],PRODUCTS[0],PRODUCTS[1]];
  $("#root").innerHTML=`<button class="icon-btn theme-fab" onclick="toggleTheme()" aria-label="Toggle light/dark theme" title="Toggle theme" data-test="theme">${ico.theme}</button><div class="login">
   <div class="login-art"><div class="bottles">${bs.map((p,i)=>`<div style="margin-left:${i?-18:0}px;transform:translateY(${i%2?0:-22}px)">${bottle(p,i%2?250:290)}</div>`).join("")}</div>
    <h2>Small batch.<br>Big heat.</h2></div>
   <div class="login-form"><form class="card login-card" id="f">
    <div style="margin-bottom:1.2rem">${logo().replace('href="#/inventory"','href="#/login"')}</div><h1 style="font-size:1.6rem">Welcome back</h1><p class="sub">Sign in to stock your pantry.</p>
    <div id="err"></div>
    <div class="field"><label>Username</label><input id="u" placeholder="Username" autocomplete="username" data-test="username"></div>
    <div class="field"><label>Password</label><input id="p" type="password" placeholder="Password" autocomplete="current-password" data-test="password"></div>
    <button class="btn" style="width:100%" data-test="login-button">Login</button>
    <div class="creds"><b>Accepted usernames</b><br><code onclick="fill('standard_user')">standard_user</code> <code onclick="fill('locked_out_user')">locked_out_user</code><br><b>Password for all users</b><br><code onclick="fill()">hot_sauce</code></div>
   </form></div></div>`;
  window.fill=u=>{if(u)$("#u").value=u;$("#p").value="hot_sauce"};
  $("#f").onsubmit=e=>{e.preventDefault();
   const u=$("#u").value.trim(),p=$("#p").value;
   const err=m=>$("#err").innerHTML=`<div class="error" data-test="error">Epic sadface: ${m}</div>`;
   if(!u)return err("Username is required");
   if(!p)return err("Password is required");
   if(!(u in USERS)||USERS[u]!==p)return err("Username and password do not match any user in this service");
   if(u==="locked_out_user")return err("Sorry, this user has been locked out.");
   user=u;store.set("hs_user",u);location.hash="#/inventory";
  };
 },
 inventory(){
  const list=[...PRODUCTS].sort({az:(a,b)=>a.name.localeCompare(b.name),za:(a,b)=>b.name.localeCompare(a.name),lo:(a,b)=>a.price-b.price,hi:(a,b)=>b.price-a.price}[sortBy]);
  $("#root").innerHTML=shell(`
  <section class="hero"><div><h1>Fire up every meal.</h1><p>Six small-batch sauces, from gentle jalapeño to face-melting Reaper. Pick your heat.</p></div>
   <div class="art">${[PRODUCTS[4],PRODUCTS[2],PRODUCTS[0]].map(p=>bottle(p,170)).join("")}</div></section>
  <div class="trust">${[[ico.truck,"Free shipping","On orders over $25"],[ico.leaf,"Real ingredients","No fillers or additives"],[ico.jar,"Small batch","Bottled in limited runs"],[ico.shield,"Fresh guarantee","Love it or we refund"]].map(t=>`<div>${t[0]}<span><b>${t[1]}</b><small>${t[2]}</small></span></div>`).join("")}</div>
  <div class="toolbar"><h2>The Lineup</h2>
   <select id="sort" aria-label="Sort" data-test="sort">
    <option value="az">Name (A → Z)</option><option value="za">Name (Z → A)</option>
    <option value="lo">Price (low → high)</option><option value="hi">Price (high → low)</option></select></div>
  <div class="grid" data-test="inventory">${list.map(p=>`
   <article class="card item" data-test="item">
    <a class="thumb" href="#/product/${p.id}" style="--tint:${p.tint}"><span class="heat">${peppers(p.heat)}</span>${bottle(p)}</a>
    <div class="item-body"><h3><a href="#/product/${p.id}" data-test="item-name">${p.name}</a></h3><p>${p.desc}</p>
     <div class="row"><span class="price" data-test="price">${money(p.price)}</span>
     ${cart.includes(p.id)?`<button class="btn danger sm" onclick="rm(${p.id})">Remove</button>`:`<button class="btn sm" onclick="add(${p.id})">Add to cart</button>`}</div></div></article>`).join("")}</div>`);
  $("#sort").value=sortBy;$("#sort").onchange=e=>{sortBy=e.target.value;render()};
 },
 product(id){
  const p=prod(id); if(!p){location.hash="#/inventory";return}
  $("#root").innerHTML=shell(`<a class="back" href="#/inventory">← Back to products</a>
  <div class="card detail"><div class="thumb" style="--tint:${p.tint}">${bottle(p,420)}</div>
   <div class="info"><h1>${p.name}</h1><div class="meter-wrap"><small style="color:var(--muted)">HEAT LEVEL</small>${meter(p.heat)}</div>
    <p style="color:var(--muted);line-height:1.7">${p.desc}</p><div class="price" style="font-size:2rem">${money(p.price)}</div>
    <div>${cart.includes(p.id)?`<button class="btn danger" onclick="rm(${p.id})">Remove</button>`:`<button class="btn" onclick="add(${p.id})">Add to cart</button>`}</div></div></div>`);
 },
 cart(){
  const items=cart.map(prod);
  $("#root").innerHTML=shell(`<h1 class="page-title">Your Cart</h1>
  ${items.length?`<div class="lines">${items.map(p=>`<div class="card line" data-test="cart-item"><div class="mini" style="--tint:${p.tint}">${bottle(p,66)}</div>
   <div><h3><a href="#/product/${p.id}" style="text-decoration:none">${p.name}</a></h3><small>Qty 1</small></div><b class="price" style="font-size:1.1rem">${money(p.price)}</b>
   <button class="btn danger sm" onclick="rm(${p.id})">Remove</button></div>`).join("")}</div>`
  :`<div class="card empty"><div style="font-size:3rem">🫙</div><p>Your cart is empty. Time to add some heat.</p></div><br>`}
  <div class="actions"><a class="btn ghost" href="#/inventory" style="text-decoration:none">Continue Shopping</a>
  ${items.length?`<a class="btn" href="#/checkout" style="text-decoration:none" data-test="checkout">Checkout</a>`:""}</div>`);
 },
 checkout(){
  if(!cart.length){location.hash="#/cart";return}
  const i=info||{};
  $("#root").innerHTML=shell(`<h1 class="page-title">Checkout: Your Information</h1>
  <form class="card form" id="cf"><div id="err"></div>
   <div class="two"><div class="field"><label>First name</label><input id="fn" value="${i.fn||""}" data-test="firstName"></div>
   <div class="field"><label>Last name</label><input id="ln" value="${i.ln||""}" data-test="lastName"></div></div>
   <div class="field"><label>Zip / Postal code</label><input id="zip" value="${i.zip||""}" data-test="postalCode"></div>
   <div class="actions"><a class="btn ghost" href="#/cart" style="text-decoration:none">Cancel</a><button class="btn" data-test="continue">Continue</button></div></form>`);
  $("#cf").onsubmit=e=>{e.preventDefault();
   const fn=$("#fn").value.trim(),ln=$("#ln").value.trim(),zip=$("#zip").value.trim();
   const err=m=>$("#err").innerHTML=`<div class="error" data-test="error">Error: ${m}</div>`;
   if(!fn)return err("First Name is required");if(!ln)return err("Last Name is required");if(!zip)return err("Postal Code is required");
   info={fn,ln,zip};store.set("hs_info",info);location.hash="#/overview"};
 },
 overview(){
  if(!cart.length||!info){location.hash="#/cart";return}
  const items=cart.map(prod),sub=items.reduce((a,p)=>a+p.price,0),tax=sub*.08;
  $("#root").innerHTML=shell(`<h1 class="page-title">Checkout: Overview</h1>
  <div class="lines" style="max-width:560px">${items.map(p=>`<div class="card line" style="grid-template-columns:60px 1fr auto"><div class="mini" style="--tint:${p.tint};height:60px">${bottle(p,52)}</div><h3>${p.name}</h3><b>${money(p.price)}</b></div>`).join("")}</div>
  <div class="card summary"><div class="row"><span>Payment</span><b style="color:var(--ink)">HotCard #7777</b></div><div class="row"><span>Shipping</span><b style="color:var(--ink)">Free Fire-Express</b></div>
   <div class="row"><span>Item total</span><span>${money(sub)}</span></div><div class="row"><span>Tax (8%)</span><span>${money(tax)}</span></div>
   <div class="row total"><span>Total</span><span>${money(sub+tax)}</span></div></div><br>
  <div class="actions" style="max-width:560px"><a class="btn ghost" href="#/inventory" style="text-decoration:none">Cancel</a><button class="btn" id="fin" data-test="finish">Finish</button></div>`);
  $("#fin").onclick=()=>{cart=[];saveCart();location.hash="#/complete"};
 },
 complete(){
  $("#root").innerHTML=shell(`<div class="card done"><div class="check">✓</div><h1>Thank you for your order!</h1>
  <p>Your sauces are being packed with extreme care and a little bit of fire. They'll be on your doorstep soon.</p>
  <a class="btn" href="#/inventory" style="text-decoration:none">Back Home</a></div>`);
 }
};
window.add=id=>{cart.push(id);saveCart();render();toast("Added to cart")};
window.rm=id=>{cart=cart.filter(x=>x!==id);saveCart();render()};

/* ---------- router ---------- */
function render(){
 const [,route="login",arg]=(location.hash||"#/login").split("/");
 if(!user&&route!=="login"){location.hash="#/login";return}
 if(user&&route==="login"){location.hash="#/inventory";return}
 (views[route]||views.inventory)(arg);bind();
 if(route!=="login")window.scrollTo(0,0);
}
addEventListener("hashchange",render);render();
</script>
</body>
</html>
